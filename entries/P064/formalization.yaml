    "name": "Attracting oscillations in sequential distributive multisite phosphorylation: dynamic enzyme sequestration and what static elimination cannot see",
    "description": "For every number of sites n >= 3, the sequential distributive n-site phosphorylation cycle with one kinase and one phosphatase, under mass-action kinetics, admits a supercritical Hopf bifurcation for suitable rate constants. Some componentwise-affine one-parameter family of rate constants has a positive, parameter-independent equilibrium. From it bifurcates, at positive rates and on one side of the critical parameter only, a family of strictly positive nonconstant periodic orbits that shrink to the equilibrium with period tending to 2*pi/w. Each orbit is orbitally asymptotically stable relative to its compatibility class: near the whole orbit, every state with the same kinase, phosphatase and substrate totals has a unique forward solution that stays positive and converges to the orbit.",
