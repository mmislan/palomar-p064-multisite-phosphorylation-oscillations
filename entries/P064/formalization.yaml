    "scope": "For each n >= 3: some componentwise-affine family of rate constants k(r), positive near r = 0, and a positive state x with Equilibrium (k r) x for all r. A family at parameter values par < 0 of strictly positive, nonconstant, periodic solutions of the literal mass-action field lies at positive rates k(par a). The period tends to 2*pi/w and the family converges uniformly to x. Each orbit has the totals of x and is orbitally asymptotically stable relative to the compatibility class, meaning same kinase, phosphatase and substrate totals: from an open neighbourhood of the whole orbit, same-total states have unique global forward solutions that keep their totals, stay positive, stay in the epsilon-tube and converge to the orbit. The result is existential in the rate family. It does not formalize the manuscript's fixed-rate site-addition inheritance from an arbitrary Hurwitz parent, the n = 1, 2 exclusions, the Hopf threshold equivalence, the 2n-1 sharpness theorem (entry P080) or quantitative constants.",
