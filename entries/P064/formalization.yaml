    "name": "Attracting oscillations in sequential distributive phosphorylation",
    "description": "Vassena (arXiv:2608.27081v2, Section 8) left open whether sequential distributive phosphorylation cycles with three or more sites admit Hopf bifurcation under mass-action kinetics. For every n >= 3, a componentwise-affine family of positive rate constants is constructed for the n-site cycle with one kinase and one phosphatase and a fixed positive equilibrium. A family of strictly positive, nonconstant periodic orbits bifurcates from this equilibrium, with amplitudes tending to zero and periods tending to a finite positive limit. Each orbit is orbitally asymptotically stable within its compatibility class: sufficiently nearby states with the same kinase, phosphatase and substrate totals have unique positive forward solutions that remain close to the orbit and converge to it.",
